<!DOCTYPE html> 

<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <title>Task 3 - Semantic Layout Challenge</title> 

    <link rel="stylesheet" href="style.css"> 

</head> 

<body> 

  

    <div class="page-container"> 

  

        <header> 

            <!-- TASK: Add Logo div and Heading 1 here --> 
            <div class="logo">
                <p>Logo<br>image</p>
            </div>
            <p id="h1head">Heading 1</p>


        </header> 

  

        <nav> 
            <p>unordered list with items of - Home, About Us and Contact Us</p>
            <!-- TASK: Create a list for: Home, About Us, Contact Us --> 

        </nav> 

  

        <main class="main-content"> 
            <!-- TASK: Add the two content boxes (text and image) --> 
            <div class="content-box">
                <p>Heading 2</p>
                <br>
                <br>
                <p>Paragraph of information text</p>
            </div>
            <div class="image-box">
                <p>image</p>
            </div>

        </main> 

  

        <footer> 

            <!-- TASK: Add footer info and the social links div --> 
            <p id="footerh1">Unordered list of footer info</p>
            <div class="social-links">
                <p>Social media links</p>
            </div>
        </footer> 

  

    </div>
